name: Build Intel app

on:
  workflow_dispatch:
  push:
    branches: [intel-build]

permissions:
  contents: read

jobs:
  dmg:
    name: Build universal DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'generic/platform=macOS'

      - name: Build Release (arm64 + x86_64)
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Confirm both architectures are present
        run: |
          APP=$(find DerivedData/Build/Products/Release -maxdepth 1 -name 'Compositor.app')
          echo "App: $APP"
          lipo -archs "$APP/Contents/MacOS/Compositor"
          lipo -archs "$APP/Contents/MacOS/Compositor" | grep -q x86_64 || { echo "no Intel slice"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/Compositor" | grep -q arm64   || { echo "no Apple slice"; exit 1; }

      - name: Ad-hoc sign the app
        run: |
          APP=$(find DerivedData/Build/Products/Release -maxdepth 1 -name 'Compositor.app')
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Version from project
        id: ver
        run: |
          S=$(xcodebuild -project Compositor.xcodeproj -scheme Compositor -configuration Release -showBuildSettings 2>/dev/null)
          V=$(print -r -- "$S" | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build the DMG
        run: |
          APP=$(find DerivedData/Build/Products/Release -maxdepth 1 -name 'Compositor.app')
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname Compositor -srcfolder "$STAGE" -ov -format UDZO "dist/Compositor-${{ steps.ver.outputs.version }}-universal.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-universal-dmg
          path: dist/*.dmg
          retention-days: 30
